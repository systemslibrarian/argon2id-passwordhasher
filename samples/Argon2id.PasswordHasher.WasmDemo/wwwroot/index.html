<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argon2id.PasswordHasher — WASM Demo</title>
    <!--
        The Pages deploy workflow rewrites this href to
        "/argon2id-passwordhasher/" so the published site loads correctly
        from its subpath. Local `dotnet run` uses "/" untouched.
    -->
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:," />
    <link href="Argon2id.PasswordHasher.WasmDemo.styles.css" rel="stylesheet" />

    <!--
        Cross-origin isolation helper: enables SharedArrayBuffer (and therefore
        multi-threaded WebAssembly) on hosts that can't set COOP/COEP headers
        themselves, like GitHub Pages. Without it, the Blazor runtime falls
        back to a single thread and the hash freezes the UI. See coi-serviceworker.js.
    -->
    <script src="coi-serviceworker.js"></script>
</head>

<body>
    <div id="app">
        <div class="bootstrap-loading">
            <span>Loading the WASM runtime…</span>
            <small>~2&nbsp;MB one-time download; cached on subsequent visits.</small>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
