name: Differential testing (nightly)

# Re-runs the differential test suite (Konscious vs Isopoh — two independent
# Argon2 implementations compared byte-for-byte) with a fresh random seed every
# night. The same tests run deterministically (fixed seed) in regular CI; this
# workflow walks a new slice of the parameter space each run.
#
# A failure here means the two implementations disagree — treat it as a
# potential engine bug. The failing test output contains the full parameter
# set + seed needed to reproduce; pin it as a regression case alongside the fix.

on:
  schedule:
    - cron: '23 2 * * *' # nightly, off the hour to spread cron load
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed for the randomized matrix (blank = derive from run id)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    name: Konscious vs Isopoh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Run differential suite with randomized seed
        env:
          DIFFERENTIAL_SEED: ${{ github.event.inputs.seed != '' && github.event.inputs.seed || github.run_id }}
        run: |
          echo "DIFFERENTIAL_SEED=$DIFFERENTIAL_SEED"
          dotnet test tests/Argon2id.PasswordHasher.Tests -c Release -f net10.0 \
            --filter "Category=Differential" \
            --logger "console;verbosity=detailed"
