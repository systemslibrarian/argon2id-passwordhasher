name: Release

# Builds, tests, packs, generates SBOMs + build-provenance attestations,
# creates a GitHub Release with all artifacts attached, and then publishes to
# NuGet.org via Trusted Publishing — when a version tag is pushed, e.g.:
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#
# NuGet publication uses OIDC Trusted Publishing (no long-lived API key
# anywhere) and is gated behind the 'nuget' environment, which requires
# manual maintainer approval. A tag push therefore PREPARES everything and
# stops; the maintainer inspects the packed artifacts on the GitHub Release,
# then approves the waiting 'publish-nuget' job to make the version public.
# Full procedure + one-time setup: PUBLISHING.md.

on:
  push:
    tags: [ 'v*' ]

# Least privilege by default. Individual jobs raise only what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

  package:
    name: Pack & attest
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create the GitHub Release
      id-token: write    # required for build provenance attestations
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Pack
        run: |
          dotnet pack src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj \
            -c Release --no-build -o artifacts
          dotnet pack src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj \
            -c Release --no-build -o artifacts

      - name: Install CycloneDX SBOM tool
        # CycloneDX is the OWASP-maintained SBOM standard. The dotnet tool
        # walks the project's resolved dependency graph and emits one SBOM
        # per project — exactly what enterprise allowlisting workflows want.
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOMs
        # One SBOM per packable project, in CycloneDX 1.4 JSON. Named to match
        # the .nupkg so artifact pairing is obvious in the GitHub Release.
        run: |
          mkdir -p sbom
          dotnet CycloneDX src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj \
            --json \
            --output sbom \
            --filename Argon2id.PasswordHasher.cyclonedx.json
          dotnet CycloneDX src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj \
            --json \
            --output sbom \
            --filename Argon2id.PasswordHasher.AspNetCore.cyclonedx.json

      - name: Generate build provenance attestations
        # SLSA-style provenance for every nupkg/snupkg AND every SBOM.
        # Consumers (and the maintainer prior to NuGet push) verify with
        # `gh attestation verify <file> --repo <owner>/<repo>`.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*.*nupkg
            sbom/*.json

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/*.*nupkg
            sbom/*.json
          retention-days: 90

      - name: Create GitHub Release
        # NuGet publication happens in the separate approval-gated
        # 'publish-nuget' job below. The release notes call that out so a
        # maintainer never assumes "tagged == published".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Preamble is PREPENDED to the API-generated notes by gh when both
          # --notes and --generate-notes are passed. Kept as a single ANSI-C
          # quoted string so it stays inside this YAML block scalar — a
          # column-0 heredoc body would dedent out of the scalar and make the
          # whole workflow file fail YAML validation.
          NOTES=$'## Status\n\nThis GitHub Release contains the packaged artifacts and provenance\nattestations for the tagged version.\n\n**NuGet publication awaits maintainer approval.** The publish job in this\nsame workflow run pushes to nuget.org via OIDC Trusted Publishing once a\nmaintainer approves the `nuget` environment deployment. Until then, these\npackages are NOT yet on nuget.org. See [PUBLISHING.md](../blob/main/PUBLISHING.md).'
          gh release create "${{ github.ref_name }}" \
            artifacts/*.nupkg artifacts/*.snupkg sbom/*.json \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES" \
            --generate-notes \
            $PRERELEASE_FLAG

  publish-nuget:
    name: Publish to NuGet.org (Trusted Publishing)
    needs: package
    runs-on: ubuntu-latest
    # Deliberate-publish gate: the 'nuget' environment requires manual
    # maintainer approval, so tagging PREPARES a release and a human makes it
    # public — the same policy as the old manual-CLI flow, minus the
    # long-lived API key. The nuget.org Trusted Publishing policy must match
    # this repo + this workflow file + this environment name.
    environment: nuget
    permissions:
      id-token: write   # OIDC token, exchanged for a short-lived NuGet API key
    steps:
      - name: Download packed artifacts
        # Reuses the exact bytes that were attested and attached to the
        # GitHub Release — no rebuild, so what was inspected is what ships.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: systemslibrarian   # nuget.org username that owns the Trusted Publishing policy

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # dotnet auto-discovers and pushes the matching .snupkg alongside
          # each .nupkg; --skip-duplicate keeps re-approvals idempotent.
          for pkg in release-artifacts/artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
