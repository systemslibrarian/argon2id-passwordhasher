name: Release

# Packs and publishes both packages to NuGet when a version tag is pushed, e.g.:
#   git tag v0.4.0-preview.1 && git push origin v0.4.0-preview.1
# Requires a repository secret named NUGET_API_KEY.

on:
  push:
    tags: [ 'v*' ]

# Least privilege by default. Individual jobs raise only what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

  publish:
    name: Pack & Publish to NuGet
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create the GitHub Release
      id-token: write    # required for build provenance attestations
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Pack
        run: |
          dotnet pack src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj \
            -c Release --no-build -o artifacts
          dotnet pack src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj \
            -c Release --no-build -o artifacts

      - name: Install CycloneDX SBOM tool
        # CycloneDX is the OWASP-maintained SBOM standard. The dotnet tool
        # walks the project's resolved dependency graph and emits one SBOM
        # per project — exactly what enterprise allowlisting workflows want.
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOMs
        # One SBOM per packable project, in CycloneDX 1.4 JSON. Named to match
        # the .nupkg so artifact pairing is obvious in the GitHub Release.
        run: |
          mkdir -p sbom
          dotnet CycloneDX src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj \
            --json \
            --output sbom \
            --filename Argon2id.PasswordHasher.cyclonedx.json
          dotnet CycloneDX src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj \
            --json \
            --output sbom \
            --filename Argon2id.PasswordHasher.AspNetCore.cyclonedx.json

      - name: Generate build provenance attestations
        # SLSA-style provenance for every nupkg/snupkg AND every SBOM we
        # publish. Consumers verify with `gh attestation verify <file>`.
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.*nupkg
            sbom/*.json

      - name: Publish to NuGet
        # --skip-duplicate makes the workflow idempotent if a tag is re-pushed.
        # The wildcard picks up both .nupkg and .snupkg.
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/*.*nupkg
            sbom/*.json
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            artifacts/*.nupkg artifacts/*.snupkg sbom/*.json \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG
