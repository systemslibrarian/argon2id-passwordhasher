name: Release

# Builds, tests, packs, generates SBOMs + build-provenance attestations, and
# creates a GitHub Release with all artifacts attached — when a version tag
# is pushed, e.g.:
#   git tag v0.4.0-preview.4 && git push origin v0.4.0-preview.4
#
# This workflow does NOT push to NuGet.org. NuGet publication is intentionally
# a manual CLI step performed from a maintainer's workstation so the operator
# can inspect the packaged artifacts before they go public. The packaged
# .nupkg / .snupkg files are attached to the GitHub Release for download, and
# the local procedure is documented in PUBLISHING.md.

on:
  push:
    tags: [ 'v*' ]

# Least privilege by default. Individual jobs raise only what they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

  package:
    name: Pack & attest
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create the GitHub Release
      id-token: write    # required for build provenance attestations
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Pack
        run: |
          dotnet pack src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj \
            -c Release --no-build -o artifacts
          dotnet pack src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj \
            -c Release --no-build -o artifacts

      - name: Install CycloneDX SBOM tool
        # CycloneDX is the OWASP-maintained SBOM standard. The dotnet tool
        # walks the project's resolved dependency graph and emits one SBOM
        # per project — exactly what enterprise allowlisting workflows want.
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOMs
        # One SBOM per packable project, in CycloneDX 1.4 JSON. Named to match
        # the .nupkg so artifact pairing is obvious in the GitHub Release.
        run: |
          mkdir -p sbom
          dotnet CycloneDX src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj \
            --json \
            --output sbom \
            --filename Argon2id.PasswordHasher.cyclonedx.json
          dotnet CycloneDX src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj \
            --json \
            --output sbom \
            --filename Argon2id.PasswordHasher.AspNetCore.cyclonedx.json

      - name: Generate build provenance attestations
        # SLSA-style provenance for every nupkg/snupkg AND every SBOM.
        # Consumers (and the maintainer prior to NuGet push) verify with
        # `gh attestation verify <file> --repo <owner>/<repo>`.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/*.*nupkg
            sbom/*.json

      - name: Upload artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/*.*nupkg
            sbom/*.json
          retention-days: 90

      - name: Create GitHub Release
        # NuGet publication is intentionally NOT done here — see PUBLISHING.md.
        # The release notes call out the manual-push step explicitly so a
        # maintainer never assumes "tagged == published".
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Preamble is PREPENDED to the API-generated notes by gh when both
          # --notes and --generate-notes are passed. Kept as a single ANSI-C
          # quoted string so it stays inside this YAML block scalar — a
          # column-0 heredoc body would dedent out of the scalar and make the
          # whole workflow file fail YAML validation.
          NOTES=$'## Status\n\nThis GitHub Release contains the packaged artifacts and provenance\nattestations for the tagged version.\n\n**NuGet publication is a separate, manual CLI step.** Until a maintainer\nruns the push from a workstation, these packages are NOT yet available\non nuget.org. See [PUBLISHING.md](../blob/main/PUBLISHING.md) for the\nprocedure.'
          gh release create "${{ github.ref_name }}" \
            artifacts/*.nupkg artifacts/*.snupkg sbom/*.json \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES" \
            --generate-notes \
            $PRERELEASE_FLAG
