name: Mutation testing (Stryker.NET)

# Weekly mutation testing of the core library. Stryker mutates the production
# IL (flips conditionals, removes statements, swaps constants) and re-runs the
# test suite per mutant; a mutant the tests don't kill is a hole in the suite.
# The break threshold in tests/Argon2id.PasswordHasher.Tests/stryker-config.json
# fails this workflow if the mutation score drops below it.

on:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday morning UTC, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Mutation score gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Stryker.NET
        run: dotnet tool install --global dotnet-stryker

      - name: Run mutation tests
        working-directory: tests/Argon2id.PasswordHasher.Tests
        run: dotnet stryker

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stryker-report-${{ github.run_id }}
          path: tests/Argon2id.PasswordHasher.Tests/StrykerOutput/**/reports/*
          retention-days: 30
