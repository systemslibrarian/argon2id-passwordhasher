name: Scorecard supply-chain security

# Runs OpenSSF Scorecard to grade the repository on supply-chain security
# (maintained, branch protection, CI tests, dangerous workflows, SAST,
# pinned dependencies, signed releases, etc.). Results land in the GitHub
# Security tab and feed the badge in README.

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    # Weekly, separate from CodeQL's day to spread the cron load.
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write    # upload SARIF to Code Scanning
      id-token: write           # required for signing the scorecard publish
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results pushes the score to the public Scorecard API so
          # the README badge can show it. Safe â€” only the score + URL.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 14

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
