name: Deploy WASM demo + DocFx site to GitHub Pages

on:
  push:
    branches: [ main ]
    # Only rebuild when something the published bundle actually depends on
    # changes. Editing tests or the Server demo doesn't trigger a re-deploy.
    paths:
      - 'samples/Argon2id.PasswordHasher.WasmDemo/**'
      - 'src/**'
      - 'docs/**'
      - 'Directory.Build.props'
      - 'global.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege at the workflow root; the deploy job widens what it needs.
permissions:
  contents: read

# Allow only one Pages deployment to run at a time; queue new ones, never
# cancel an in-flight deploy (avoids leaving the live site half-published).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Publish WASM demo + DocFx site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x

      - name: Install DocFx
        run: dotnet tool install -g docfx

      - name: Restore (demo)
        run: dotnet restore samples/Argon2id.PasswordHasher.WasmDemo/Argon2id.PasswordHasher.WasmDemo.csproj

      - name: Publish WASM demo
        # --nologo keeps the log clean; the Blazor SDK does its own static-asset
        # fingerprinting, so we just need the final wwwroot/ tree.
        # -f is required because the csproj uses <TargetFrameworks> (plural)
        # even though only net10.0 is listed — MSBuild treats it as cross-targeting.
        run: |
          dotnet publish samples/Argon2id.PasswordHasher.WasmDemo/Argon2id.PasswordHasher.WasmDemo.csproj \
            -c Release \
            -f net10.0 \
            -o publish \
            --nologo

      - name: Build DocFx site
        # `docfx` runs both metadata extraction (from the src csprojs via
        # docs/docfx.json) and the site build. Output lands at docs/_site/.
        run: docfx docs/docfx.json

      - name: Stage DocFx site under /docs/ of the bundle
        # Single Pages deployment serves both the WASM demo (at /) and the
        # DocFx site (at /docs/). Copy after WASM publish so it doesn't
        # interfere with the demo's static-asset hashing.
        run: |
          mkdir -p publish/wwwroot/docs
          cp -r docs/_site/. publish/wwwroot/docs/

      - name: Rewrite <base href> for GitHub Pages subpath
        # The site is served at https://<user>.github.io/<repo>/ so every
        # absolute asset path must be relative to that subpath. We patch the
        # bootstrap HTML once after publish; this is the only deviation from
        # what a root-hosted deploy would do.
        #
        # We verify the substitution actually fired (and check both the
        # pre- and post-state) so an accidental edit to index.html that
        # broke the sed pattern would fail the workflow instead of silently
        # publishing a site whose asset paths are all 404.
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          INDEX="publish/wwwroot/index.html"
          OLD_HREF='<base href="/" />'
          NEW_HREF="<base href=\"/${REPO_NAME}/\" />"

          if ! grep -qF "$OLD_HREF" "$INDEX"; then
            echo "::error::Expected '$OLD_HREF' in $INDEX but did not find it."
            echo "::error::Either the HTML has drifted or it was already rewritten."
            echo "::error::Update the sed step in .github/workflows/pages.yml to match."
            exit 1
          fi

          sed -i "s|${OLD_HREF}|${NEW_HREF}|" "$INDEX"

          if ! grep -qF "$NEW_HREF" "$INDEX"; then
            echo "::error::Substitution produced no change in $INDEX."
            exit 1
          fi

          echo "Rewrote <base href> to /${REPO_NAME}/"

          # SPA fallback: GitHub Pages serves 404.html for any unknown path,
          # so duplicating index.html lets client-side routing take over.
          cp "$INDEX" publish/wwwroot/404.html
          # Stop Jekyll from stripping the `_framework/` folder.
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # required for actions/deploy-pages
      id-token: write    # required for OIDC-based deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
