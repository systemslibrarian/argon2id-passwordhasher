name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege by default. Individual jobs widen this only when needed.
permissions:
  contents: read

# Cancel superseded runs for the same ref so PRs don't fan out.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Verify formatting + style
        # Fails the build if any file would be modified by `dotnet format`.
        # This catches forgotten editorconfig adherence in PRs.
        run: dotnet format --verify-no-changes --no-restore --severity warn

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so SourceLink/deterministic builds work

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          # The library also targets net8.0 + net9.0; install those runtimes so
          # the test host can spin up across every TFM.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings = errors via Directory.Build.props)
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test (all TFMs)
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ github.workspace }}/TestResults/**/*.trx
          retention-days: 14

  coverage:
    name: Coverage gate
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Test with coverage threshold (core)
        # coverlet.msbuild fails the build if line coverage drops below the
        # threshold. Ratchet the numbers up over time â€” never down.
        run: >
          dotnet test tests/Argon2id.PasswordHasher.Tests -c Release -f net10.0
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Include="[Argon2id.PasswordHasher]*"
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Test with coverage threshold (AspNetCore adapter)
        run: >
          dotnet test tests/Argon2id.PasswordHasher.AspNetCore.Tests -c Release -f net10.0
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Include="[Argon2id.PasswordHasher.AspNetCore]*"
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: tests/**/coverage.cobertura.xml
          retention-days: 14

  aot-smoke:
    name: Native AOT smoke test
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Publish Native AOT smoke test
        # Proves IsAotCompatible with a real trimmed AOT binary, not just the
        # absence of analyzer warnings. Trim/AOT warnings are errors here.
        run: >
          dotnet publish samples/Argon2id.PasswordHasher.AotSmokeTest/Argon2id.PasswordHasher.AotSmokeTest.csproj
          -c Release -f net10.0 -r linux-x64 -o aot-publish
          -p:TreatWarningsAsErrors=true

      - name: Run AOT binary
        run: ./aot-publish/Argon2id.PasswordHasher.AotSmokeTest

  repro-build:
    name: Reproducible build check
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build + pack twice from clean state and compare assemblies
        # Deterministic + ContinuousIntegrationBuild should make the IL
        # byte-for-byte identical across builds of the same commit. The nupkg
        # zip container embeds timestamps, so we compare the assemblies inside.
        run: |
          set -euo pipefail

          pack() {
            dotnet restore
            dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true
            dotnet pack src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -o "$1"
            dotnet pack src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj -c Release --no-build -p:ContinuousIntegrationBuild=true -o "$1"
          }

          pack /tmp/pack1
          git clean -xdf --quiet
          pack /tmp/pack2

          hash_assemblies() {
            local dir="$1" out="$2"
            mkdir -p "$dir/extracted"
            for pkg in "$dir"/*.nupkg; do
              unzip -q "$pkg" 'lib/*' -d "$dir/extracted/$(basename "$pkg" .nupkg)"
            done
            (cd "$dir/extracted" && find . -name '*.dll' -print0 | sort -z | xargs -0 sha256sum) > "$out"
          }

          hash_assemblies /tmp/pack1 /tmp/hashes1.txt
          hash_assemblies /tmp/pack2 /tmp/hashes2.txt

          echo "--- build 1 ---"; cat /tmp/hashes1.txt
          echo "--- build 2 ---"; cat /tmp/hashes2.txt
          diff /tmp/hashes1.txt /tmp/hashes2.txt && echo "Reproducible: assemblies are byte-for-byte identical."

  pack:
    name: Pack (verification)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack both packages
        # Produces .nupkg + .snupkg per project. This is a verification pack â€”
        # the Release workflow handles the actual NuGet push.
        run: |
          dotnet pack src/Argon2id.PasswordHasher/Argon2id.PasswordHasher.csproj -c Release --no-build -o artifacts
          dotnet pack src/Argon2id.PasswordHasher.AspNetCore/Argon2id.PasswordHasher.AspNetCore.csproj -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: artifacts/*.*nupkg
          retention-days: 14
