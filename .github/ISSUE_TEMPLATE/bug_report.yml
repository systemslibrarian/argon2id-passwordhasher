name: Bug report
description: Report a defect in Argon2id.PasswordHasher.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security note:** if this is a security vulnerability, **do not file a public issue**.
        Use the private [Security Advisory](https://github.com/systemslibrarian/argon2id-passwordhasher/security/advisories/new) channel instead.

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: e.g. `0.3.0-preview.1`
      placeholder: "0.3.0-preview.1"
    validations:
      required: true

  - type: dropdown
    id: target-framework
    attributes:
      label: Target framework
      multiple: true
      options:
        - net8.0
        - net9.0
        - net10.0
        - other
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      multiple: true
      options:
        - Argon2id.PasswordHasher (core)
        - Argon2id.PasswordHasher.AspNetCore (Identity adapter)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the unexpected behavior.
      placeholder: When I call X with Y, I see Z; I expected …
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest possible code snippet that reproduces the issue.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK version, anything else relevant.
      placeholder: |
        - OS:
        - dotnet --info:
